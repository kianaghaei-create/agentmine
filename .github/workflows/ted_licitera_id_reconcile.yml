name: Cross-source TED Licitera CPV7231 ID reconciliation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ted_licitera_id_reconcile.yml"
      - "src/ted_licitera_id_reconcile.py"
      - "src/ted_title_gap_triage.py"
      - "src/ted_procedure_gap_triage.py"
      - "src/ted_cross_month_procedure.py"
      - "src/ted_target_procedure_probe.py"
      - "src/ted_notice_evidence.py"
      - "src/ted_cpv7231_public_probe.py"
      - "src/licitera_monthly_supply.py"
      - "src/licitera_cpv_segment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-public-id-join:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile only while September 2026 is the free previous-month cohort
        run: |
          # Do not attempt to fetch the historical cohort after its free window.
          # A skipped run is NOT a successful source reconciliation.
          if [ "$(date -u +%Y-%m)" != "2026-10" ]; then
            echo "SKIPPED: September 2026 is not the free previous-month cohort; no sources fetched."
            exit 0
          fi
          python3 -m src.ted_licitera_id_reconcile --cross-month --cross-cpv --output ted-licitera-aggregate.json
      - name: Upload aggregate counts only when reconciliation produced evidence
        if: ${{ hashFiles('ted-licitera-aggregate.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ted-licitera-cpv7231-aggregate
          path: ted-licitera-aggregate.json
          if-no-files-found: error
          retention-days: 7
